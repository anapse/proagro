# ============================================================
# PROAGRO WEB — Worker
# Conserva la config de despliegue actual (name/main/compatibility).
#
# COMUNIDAD necesita 3 cosas en Cloudflare (ver GUIA_COMUNIDAD.md):
#   1) Base D1 llamada  proagro-comunidad   (creada en el dashboard)
#   2) Secret:  COMMUNITY_ADMIN_TOKEN       (wrangler secret put)
#   3) [Opcional] Bucket R2  proagro-media   para imágenes de noticias
#
# Cuando tengas el database_id (sácalo con: npx wrangler d1 list),
# descomenta el bloque [d1_databases] y pega el id. Después ejecuta:
#   npx wrangler d1 migrations apply proagro-comunidad --remote
#   npx wrangler deploy
# ============================================================

name = "proagro-api"
main = "cloudflare/worker.js"
compatibility_date = "2025-01-01"

# --- D1 (COMUNIDAD) — DESCOMENTAR tras poner el database_id real ---
# [[d1_databases]]
# binding = "DB"                 # env.DB (NO cambiar el nombre)
# database_name = "proagro-comunidad"
# database_id = "PEGA_AQUI_EL_ID_DE_wrangler_d1_list"

# --- R2 (imágenes noticias/avisos) — OPCIONAL, DESCOMENTAR tras crear el bucket ---
# [[r2_buckets]]
# binding = "MEDIA"              # env.MEDIA
# bucket_name = "proagro-media"
# (opcional) variable para servir imágenes por URL pública:
# vars = { MEDIA_PUBLIC_URL = "https://pub-XXXXXXXX.r2.dev" }
