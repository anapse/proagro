# ============================================================
# PROAGRO WEB — Worker
# Worker real:  proagro-api  (cuenta elherreroanapse)
# D1 real:      proagro-comunidad  (binding env.DB)
# ============================================================

name = "proagro-api"
main = "worker.js"
compatibility_date = "2025-01-01"

# --- D1 (COMUNIDAD) — base REAL creada en Cloudflare ---
[[d1_databases]]
binding = "DB"                       # env.DB (NO cambiar el nombre)
database_name = "proagro-comunidad"  # NO crear otra base
database_id = "029852c7-b5da-4bb4-bf48-2c44f745c644"

# --- R2 (imágenes noticias/avisos) — OPCIONAL, solo cuando exista el bucket ---
# [[r2_buckets]]
# binding = "MEDIA"                   # env.MEDIA
# bucket_name = "proagro-media"
# (opcional) variable para servir imágenes por URL pública:
# vars = { MEDIA_PUBLIC_URL = "https://pub-XXXXXXXX.r2.dev" }
